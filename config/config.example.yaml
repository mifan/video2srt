# Copy this file to config/config.yaml (or pass it with --config) and fill in
# the local model paths. Relative paths are resolved from the current directory.

models:
  asr: /absolute/path/to/Qwen3-ASR-1.7B
  aligner: /absolute/path/to/Qwen3-ForcedAligner

# "ffmpeg" uses the executable available in PATH by default.
ffmpeg:
  path: ffmpeg

# auto selects CUDA when available; otherwise the current code falls back to CPU.
device: auto

# auto uses Qwen3-ASR's detected language. Set e.g. Chinese or English to force it.
language: auto

output:
  # null writes next to the input video; set a directory to write subtitles there.
  directory: null
  overwrite: false

chunk:
  seconds: 300
  overlap_seconds: 2

subtitle:
  format: srt
  max_chars: 24
  max_duration_seconds: 6.0
  max_cps: 15
